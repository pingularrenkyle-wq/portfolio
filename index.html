<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <script src="src/tailwind.js"></script>
    <script src="src/vue.js"></script>
    <script src="src/VueRouter.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-serif bg-[url('/imgs/bg.jpg')] bg-cover bg-fixed bg-center
             scrollbar-thin scrollbar-thumb-red-500 scrollbar-track-transparent bg-no-repeat min-h-screen before:invert" >
 <div id="app">
    <section class="flex flex-col lg:flex-row gap-6 min-h-screen">

            <div @click="openBurger" v-if="page === ''" class="fixed cursor-pointer z-20 md:hidden pt-5 pl-5">

                <svg class="w-8 h-8 stroke-white" fill="none"  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>      

            </div>  
                        
        <!-- SMALLER SCREENS SIDEBAR  -->    
        <div v-if="page === 'burgerClicked'" class="fixed h-screen z-30 bg-black md:hidden w-[300px] pt-5 px-5 flex flex-col">
                 <div @click="closeBurger" v-if="page === 'burgerClicked'"class="cursor-pointer">

                    <svg class="w-8 h-8 stroke-white" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>          
                </div>    
            
            <div class="flex flex-col justify-center items-left w-full text mt-6 gap-3">
                <router-link 
                class="text-left hover:bg-red-600 hover:shadow-[0_0_25px_rgba(255,0,0,1)] text-[17px] transition-all duration-200 rounded-md px-2 py-1"
                active-class="bg-red-600 shadow-[0_0_25px_rgba(255,0,0,1)] text-white"
                v-for="(nav, index) in navs"
                :key="index"
                :to="nav.link">
                    <i :class="nav.icon"></i>
                    <span class="pl-2">{{nav.nav}}</span>
                </router-link>                
            </div>

        </div> 
        
        <!-- MEDIUM SCREENS HEADER  -->
        <header class="hidden md:block lg:hidden sticky top-0 z-20 bg-black/85 backdrop-blur-md border-b-[1.5px] border-red-600 shadow-[0_5px_25px_rgba(255,0,0,0.25)] px-10 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="img sm">
                        <div class="imgbox">
                            <div class="imgitem">
                                <img class="h-full object-cover object-top" src="imgs/Me.jpg" alt="Kyle Pingul">
                            </div>
                        </div>
                    </div>
                    <div>
                        <h1 class="text-xl leading-tight">Kyle Pingul</h1>
                        <p class="text-sm">@arren.kayn7</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <a
                    class="border-2 border-red-600 text-sm px-2 py-1.5 text-center rounded-full hover:bg-red-600 hover:text-white transition-all duration-500 hover:-translate-y-1 hover:shadow-[0_0_25px_rgba(255,0,0,1)]"
                    v-for="(social, index) in icons"
                    :key="index"
                    :href="social.link">
                        <i :class="social.icon" class="text-red-600 hover:text-white transition-all duration-500"></i>
                    </a>
                </div>
            </div>

            <nav class="grid grid-cols-5 gap-2 mt-4">
                <router-link
                class="text-center text-sm hover:bg-red-600 hover:shadow-[0_0_25px_rgba(255,0,0,1)] transition-all duration-200 rounded-md px-2 py-1.5"
                active-class="bg-red-600 shadow-[0_0_25px_rgba(255,0,0,1)] text-white"
                v-for="(nav, index) in navs"
                :key="index"
                :to="nav.link">
                    <i :class="nav.icon"></i>
                    <span class="pl-1.5">{{nav.nav}}</span>
                </router-link>
            </nav>
        </header>

        <!-- NORMAL SIDEBAR  -->
        <div class="hidden h-screen lg:block lg:sticky lg:top-0 lg:self-start lg:shrink-0 lg:overflow-y-auto w-[250px] pt-10 px-5 flex justify-center items-center">   

            <div class="img flex justify-center">
                <div class="imgbox">
                    <div class="imgitem">   
                        <img class="h-[190px]" src="imgs/Me.jpg">
                    </div>
                </div>
            </div>
            <h1 class="mt-4 text-2xl text-center">Kyle Pingul</h1>
            <p class="text-sm text-center">@arren.kayn7</p>
            <div class="flex justify-center items-center gap-3 mt-3">
                <a 
                class="border-2 border-red-600 text-sm px-2 py-1.5 text-center rounded-full hover:bg-red-600 hover:text-white transition-all duration-500 hover:-translate-y-1 hover:shadow-[0_0_25px_rgba(255,0,0,1)]"
                v-for="(social, index) in icons"
                :key="index"
                :href="social.link"
                >
                
                <i :class="social.icon" class="text-red-600 hover:text-white transition-all duration-500"></i>
            </a>
            
            </div>   
            
            <hr class="w-full bg-white mt-4">    
            
            <div class="flex flex-col justify-center items-left w-full mt-6 gap-3">
                <router-link 
                class="hover:bg-red-600 hover:shadow-[0_0_25px_rgba(255,0,0,1)] transition-all duration-200 rounded-md px-2 py-1"
                active-class="bg-red-600 shadow-[0_0_25px_rgba(255,0,0,1)] text-white"
                v-for="(nav, index) in navs"
                :key="index"
                :to="nav.link">
                    <i :class="nav.icon"></i>
                    <span class="pl-2">{{nav.nav}}</span>
                </router-link>                
            </div>

        </div>         

        <div class="w-full flex flex-col justify-center mt-20 items-center md:hidden">
            <div class="img">
                <div class="imgbox w-[100px]">
                    <div class="imgitem">   
                        <img class="" src="imgs/Me.jpg">
                    </div>
                </div>
            </div>   
            <h1 class="mt-4 text-2xl">Kyle Pingul</h1>
            <p class="text-sm">@arren.kayn7</p> 
            <div class="flex justify-center items-center gap-3 mt-3">
                <a 
                class="border-2 border-red-600 text-sm px-2 py-1.5 text-center rounded-full hover:bg-red-600 hover:text-white transition-all duration-500 hover:-translate-y-1 hover:shadow-[0_0_25px_rgba(255,0,0,1)]"
                v-for="(social, index) in icons"
                :key="index"
                :href="social.link"
                >
                
                <i :class="social.icon" class="hover:text-white transition-all duration-500"></i>
            </a>
            
            </div>             
            
        </div>        

        <div class="w-full ">
            <router-view v-slot="{ Component, route }">
                <transition name="page" mode="out-in">
                    <component :is="Component" :key="route.path"></component>
                </transition>
            </router-view>
        </div>       

    </section>      
    </div>

    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="router.js"></script>

    <script>
        const app = Vue.createApp({
            setup() {
                return useModel();
            }
        });
        app.use(router);
        app.mount("#app");
    </script>

</body>
</html>
